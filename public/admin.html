<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LightNet — Візуальна адмін-панель</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090a0f;
      color: #f1f2f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .admin-wrapper {
      width: 100%;
      max-width: 1300px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Екран входу */
    .login-box {
      background: #141722;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 380px;
      margin: 100px auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

    input, select {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }
    input:focus, select:focus { border-color: #2ed573; }

    .btn {
      background: #2ed573;
      border: none;
      color: #090a0f;
      font-weight: 700;
      padding: 9px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }

    /* Головна розмітка адмінки: 2 колонки */
    .main-grid {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 24px;
    }

    @media (max-width: 980px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .card-panel {
      background: #141722;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* Верхня панель списку пресетів */
    .preset-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
    }
    .preset-tab-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 7px 14px;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .preset-tab-btn.active {
      background: #2ed573;
      color: #090a0f;
      border-color: #2ed573;
    }

    .ctrl-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .ctrl-row label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    .range-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    input[type=range] {
      -webkit-appearance: none;
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #2ed573;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      cursor: pointer;
    }

    .color-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .color-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #cbd5e1;
    }
    input[type=color] {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      padding: 0;
    }

    /* Монітор попереднього перегляду (Preview) */
    .preview-container {
      position: sticky;
      top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .monitor-screen {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 15px 45px rgba(0,0,0,0.7);
    }

    .preview-bg-media {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
    }

    .preview-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(9, 10, 15, 0.6);
      transition: background 0.1s;
    }

    .preview-stage {
      position: absolute;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      pointer-events: none;
      z-index: 5;
    }

    .preview-caption {
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .preview-timer {
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      line-height: 1;
    }

    .preview-hint {
      margin-top: 8px;
      font-size: 0.72rem;
      opacity: 0.8;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .status-msg.ok { color: #2ed573; }
    .status-msg.err { color: #ff4757; }
  </style>
</head>
<body>

<div class="admin-wrapper">

  <!-- Екран авторизації -->
  <div id="loginSection" class="login-box">
    <h2 style="font-size: 1.25rem;">Вхід в адмін-панель</h2>
    <p style="color: #8391a5; font-size: 0.85rem;">Введіть захисний пароль із середовища Render</p>
    <input type="password" id="adminPassInput" placeholder="Пароль адміністратора" />
    <button class="btn" id="loginBtn">Увійти</button>
    <div class="status-msg err" id="loginError"></div>
  </div>

  <!-- Робочий інтерфейс з живим прев'ю -->
  <div id="contentSection" style="display: none; flex-direction: column; gap: 18px;">
    
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2 style="font-size: 1.3rem;">Налаштування глобальних тем (Live Preview)</h2>
      <button class="btn" id="saveAllBtn">Зберегти всі зміни для всіх</button>
    </div>

    <!-- Вкладки пресетів -->
    <div style="display: flex; gap: 10px; align-items: center;">
      <div class="preset-tabs" id="presetTabsContainer"></div>
      <button class="btn" id="addPresetBtn" style="background: rgba(46, 213, 115, 0.15); color: #2ed573; border: 1px solid rgba(46, 213, 115, 0.3); font-size: 0.85rem; padding: 6px 12px;">+ Новий</button>
      <button id="delCurrentBtn" style="background: rgba(255, 71, 87, 0.15); color: #ff4757; border: 1px solid rgba(255, 71, 87, 0.3); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem;">Видалити тему</button>
    </div>

    <div class="main-grid">
      <!-- Ліва колонка: Інтерактивні контролери -->
      <div class="card-panel">
        
        <div class="ctrl-row">
          <label>Назва теми</label>
          <input type="text" id="inpName" />
        </div>

        <div class="ctrl-row">
          <label>URL відео/фото (/totoro.mp4, /emerald-rain.mp4 або URL)</label>
          <input type="text" id="inpUrl" />
        </div>

        <div class="ctrl-row">
          <label>Тип медіа</label>
          <select id="inpType">
            <option value="video">video</option>
            <option value="image">image</option>
          </select>
        </div>

        <hr style="border: none; border-top: 1px solid rgba(255, 255, 255, 0.08); margin: 4px 0;" />

        <!-- Позиція по вертикалі -->
        <div class="ctrl-row">
          <label>Позиція по вертикалі <span id="lblPos">50%</span></label>
          <div class="range-wrap">
            <input type="range" id="rangePos" min="20" max="88" value="50" />
          </div>
        </div>

        <!-- Розмір таймера -->
        <div class="ctrl-row">
          <label>Розмір таймера <span id="lblScale">100%</span></label>
          <div class="range-wrap">
            <input type="range" id="rangeScale" min="50" max="160" value="100" />
          </div>
        </div>

        <!-- Затемнення фону -->
        <div class="ctrl-row">
          <label>Затемнення фону <span id="lblDim">55%</span></label>
          <div class="range-wrap">
            <input type="range" id="rangeDim" min="0" max="95" value="55" />
          </div>
        </div>

        <!-- Радіус світіння -->
        <div class="ctrl-row">
          <label>Радіус підсвітки (світіння) <span id="lblGlow">25px</span></label>
          <div class="range-wrap">
            <input type="range" id="rangeGlow" min="0" max="60" value="25" />
          </div>
        </div>

        <!-- Світіння тумблер -->
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 4px 0;">
          <span style="font-size: 0.88rem; color: #cbd5e1; font-weight: 500;">Підсвітка таймера</span>
          <input type="checkbox" id="chkGlow" style="width: 20px; height: 20px; accent-color: #2ed573; cursor: pointer;" />
        </div>

        <!-- Кольори -->
        <div class="ctrl-row">
          <label>Колірна палітра</label>
          <div class="color-row">
            <div class="color-box">
              <span>Текст</span>
              <input type="color" id="colText" />
            </div>
            <div class="color-box">
              <span>Світло є</span>
              <input type="color" id="colGreen" />
            </div>
            <div class="color-box">
              <span>Відключення</span>
              <input type="color" id="colRed" />
            </div>
          </div>
        </div>

        <div class="status-msg" id="statusMsg"></div>
      </div>

      <!-- Права колонка: Живий попередній перегляд (Preview) -->
      <div class="preview-container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 0.85rem; color: #94a3b8; font-weight: 600;">ЖИВИЙ ПЕРЕГЛЯД (16:9)</span>
          <div style="display: flex; gap: 8px;">
            <button id="previewModeGreen" style="background: rgba(46, 213, 115, 0.2); color:#2ed573; border: 1px solid rgba(46,213,115,0.4); border-radius:6px; padding:4px 8px; font-size:0.75rem; cursor:pointer;">Режим "Світло є"</button>
            <button id="previewModeRed" style="background: rgba(255, 71, 87, 0.2); color:#ff4757; border: 1px solid rgba(255,71,87,0.4); border-radius:6px; padding:4px 8px; font-size:0.75rem; cursor:pointer;">Режим "Відключення"</button>
          </div>
        </div>

        <div class="monitor-screen">
          <!-- Фонове відео або фото -->
          <img id="prevImg" class="preview-bg-media" style="display:none;" />
          <video id="prevVideo" class="preview-bg-media" autoplay loop muted playsinline style="display:none;"></video>
          <div id="prevOverlay" class="preview-overlay"></div>

          <!-- Макет таймера -->
          <div id="prevStage" class="preview-stage">
            <div id="prevCaption" class="preview-caption">ДО ВІДКЛЮЧЕННЯ СВІТЛА</div>
            <div id="prevTimer" class="preview-timer">01:38:10</div>
            <div id="prevHint" class="preview-hint">Період без світла: 22:30 — 23:59</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  let presets = [];
  let currentPassword = '';
  let activeIndex = 0;
  let previewState = 'red'; // 'red' або 'green'

  const loginSection = document.getElementById('loginSection');
  const contentSection = document.getElementById('contentSection');
  const loginError = document.getElementById('loginError');

  // Елементи форми
  const inpName = document.getElementById('inpName');
  const inpUrl = document.getElementById('inpUrl');
  const inpType = document.getElementById('inpType');
  const rangePos = document.getElementById('rangePos');
  const lblPos = document.getElementById('lblPos');
  const rangeScale = document.getElementById('rangeScale');
  const lblScale = document.getElementById('lblScale');
  const rangeDim = document.getElementById('rangeDim');
  const lblDim = document.getElementById('lblDim');
  const rangeGlow = document.getElementById('rangeGlow');
  const lblGlow = document.getElementById('lblGlow');
  const chkGlow = document.getElementById('chkGlow');
  const colText = document.getElementById('colText');
  const colGreen = document.getElementById('colGreen');
  const colRed = document.getElementById('colRed');

  // Елементи Preview
  const prevImg = document.getElementById('prevImg');
  const prevVideo = document.getElementById('prevVideo');
  const prevOverlay = document.getElementById('prevOverlay');
  const prevStage = document.getElementById('prevStage');
  const prevCaption = document.getElementById('prevCaption');
  const prevTimer = document.getElementById('prevTimer');
  const prevHint = document.getElementById('prevHint');

  // Авторизація
  document.getElementById('loginBtn').onclick = async () => {
    const pwd = document.getElementById('adminPassInput').value.trim();
    if (!pwd) return;

    try {
      const res = await fetch('/api/admin/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd })
      });
      const data = await res.json();
      if (res.ok) {
        currentPassword = pwd;
        presets = data.presets || [];
        loginSection.style.display = 'none';
        contentSection.style.display = 'flex';
        renderTabs();
        selectPreset(0);
      } else {
        loginError.textContent = data.error || 'Невірний пароль';
      }
    } catch (e) {
      loginError.textContent = 'Помилка з’єднання із сервером';
    }
  };

  function renderTabs() {
    const container = document.getElementById('presetTabsContainer');
    container.innerHTML = presets.map((p, idx) => `
      <button class="preset-tab-btn ${idx === activeIndex ? 'active' : ''}" onclick="selectPreset(${idx})">
        ${p.name || 'Тема ' + (idx + 1)}
      </button>
    `).join('');
  }

  function selectPreset(idx) {
    if (idx < 0 || idx >= presets.length) return;
    activeIndex = idx;
    renderTabs();

    const p = presets[idx];
    inpName.value = p.name || '';
    inpUrl.value = p.url || '';
    inpType.value = p.type || 'video';

    rangePos.value = p.pos ?? 50;
    lblPos.textContent = rangePos.value + '%';

    rangeScale.value = p.scale ?? 100;
    lblScale.textContent = rangeScale.value + '%';

    rangeDim.value = p.dim ?? 55;
    lblDim.textContent = rangeDim.value + '%';

    rangeGlow.value = p.glowRadius ?? 25;
    lblGlow.textContent = rangeGlow.value + 'px';

    chkGlow.checked = p.glowEnabled !== false;

    colText.value = p.textColor || '#a4b0be';
    colGreen.value = p.greenColor || '#2ed573';
    colRed.value = p.redColor || '#ff4757';

    updatePreview();
  }

  // Оновлення Preview в реальному часі
  function updatePreview() {
    const p = presets[activeIndex];
    if (!p) return;

    // Фон
    if (p.type === 'video') {
      prevImg.style.display = 'none';
      if (prevVideo.src !== location.origin + p.url && prevVideo.src !== p.url) {
        prevVideo.src = p.url;
      }
      prevVideo.style.display = 'block';
    } else {
      prevVideo.style.display = 'none';
      prevImg.src = p.url;
      prevImg.style.display = 'block';
    }

    // Затемнення
    prevOverlay.style.background = `rgba(9, 10, 15, ${p.dim / 100})`;

    // Позиція по вертикалі
    prevStage.style.top = `${p.pos}%`;

    // Розмір шрифту
    const scaleFactor = p.scale / 100;
    prevTimer.style.fontSize = `${2.8 * scaleFactor}rem`;
    prevCaption.style.fontSize = `${0.75 * scaleFactor}rem`;
    prevHint.style.fontSize = `${0.72 * scaleFactor}rem`;

    // Кольори
    prevCaption.style.color = p.textColor;
    prevHint.style.color = p.textColor;

    const activeColor = previewState === 'green' ? p.greenColor : p.redColor;
    prevTimer.style.color = activeColor;

    // Світіння
    if (p.glowEnabled) {
      prevTimer.style.filter = `drop-shadow(0 0 ${p.glowRadius * 0.7}px ${activeColor})`;
    } else {
      prevTimer.style.filter = 'none';
    }
  }

  // Прив'язка подій до повзунків (Live input)
  rangePos.oninput = () => {
    presets[activeIndex].pos = Number(rangePos.value);
    lblPos.textContent = rangePos.value + '%';
    updatePreview();
  };

  rangeScale.oninput = () => {
    presets[activeIndex].scale = Number(rangeScale.value);
    lblScale.textContent = rangeScale.value + '%';
    updatePreview();
  };

  rangeDim.oninput = () => {
    presets[activeIndex].dim = Number(rangeDim.value);
    lblDim.textContent = rangeDim.value + '%';
    updatePreview();
  };

  rangeGlow.oninput = () => {
    presets[activeIndex].glowRadius = Number(rangeGlow.value);
    lblGlow.textContent = rangeGlow.value + 'px';
    updatePreview();
  };

  chkGlow.onchange = () => {
    presets[activeIndex].glowEnabled = chkGlow.checked;
    updatePreview();
  };

  colText.oninput = () => {
    presets[activeIndex].textColor = colText.value;
    updatePreview();
  };
  colGreen.oninput = () => {
    presets[activeIndex].greenColor = colGreen.value;
    updatePreview();
  };
  colRed.oninput = () => {
    presets[activeIndex].redColor = colRed.value;
    updatePreview();
  };

  inpName.oninput = () => {
    presets[activeIndex].name = inpName.value;
    renderTabs();
  };

  inpUrl.onchange = () => {
    presets[activeIndex].url = inpUrl.value;
    updatePreview();
  };

  inpType.onchange = () => {
    presets[activeIndex].type = inpType.value;
    updatePreview();
  };

  // Перемикання станів попереднього перегляду (Зелений / Червоний)
  document.getElementById('previewModeGreen').onclick = () => {
    previewState = 'green';
    prevCaption.textContent = 'ДО УВІМКНЕННЯ СВІТЛА';
    updatePreview();
  };
  document.getElementById('previewModeRed').onclick = () => {
    previewState = 'red';
    prevCaption.textContent = 'ДО ВІДКЛЮЧЕННЯ СВІТЛА';
    updatePreview();
  };

  // Додавання нової теми
  document.getElementById('addPresetBtn').onclick = () => {
    presets.push({
      name: 'Нова тема',
      url: '/totoro.mp4',
      type: 'video',
      textColor: '#a4b0be',
      greenColor: '#2ed573',
      redColor: '#ff4757',
      dim: 55,
      pos: 50,
      scale: 100,
      glowEnabled: true,
      glowRadius: 25
    });
    selectPreset(presets.length - 1);
  };

  // Видалення активної теми
  document.getElementById('delCurrentBtn').onclick = () => {
    if (presets.length <= 1) {
      alert('Потрібно залишити щонайменше одну тему!');
      return;
    }
    if (confirm(`Видалити тему "${presets[activeIndex].name}"?`)) {
      presets.splice(activeIndex, 1);
      selectPreset(Math.max(0, activeIndex - 1));
    }
  };

  // Збереження
  document.getElementById('saveAllBtn').onclick = async () => {
    const statusMsg = document.getElementById('statusMsg');
    try {
      const res = await fetch('/api/admin/presets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: currentPassword, presets })
      });
      const data = await res.json();
      if (res.ok) {
        statusMsg.textContent = 'Всі налаштування успішно збережено для всіх користувачів!';
        statusMsg.className = 'status-msg ok';
      } else {
        statusMsg.textContent = data.error || 'Помилка збереження';
        statusMsg.className = 'status-msg err';
      }
    } catch (e) {
      statusMsg.textContent = 'Помилка підключення до сервера';
      statusMsg.className = 'status-msg err';
    }
    setTimeout(() => { statusMsg.textContent = ''; }, 4000);
  };
</script>
</body>
</html>
