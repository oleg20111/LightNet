<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LightNet — Адмін-панель пресетів</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090a0f;
      color: #f1f2f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 30px 20px;
      display: flex;
      justify-content: center;
    }
    .admin-container {
      width: 100%;
      max-width: 850px;
      background: #141722;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    h1 { font-size: 1.4rem; margin-bottom: 20px; color: #fff; }
    .auth-block {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    input, select {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }
    input:focus, select:focus { border-color: #2ed573; }
    .btn {
      background: #2ed573;
      border: none;
      color: #090a0f;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-del {
      background: rgba(255, 71, 87, 0.2);
      border: 1px solid rgba(255, 71, 87, 0.4);
      color: #ff4757;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-add {
      background: rgba(46, 213, 115, 0.15);
      border: 1px solid rgba(46, 213, 115, 0.3);
      color: #2ed573;
      margin-top: 10px;
      cursor: pointer;
      padding: 9px 14px;
      border-radius: 8px;
    }
    .preset-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .preset-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.8rem;
      color: #8391a5;
    }
    .color-input {
      width: 40px;
      height: 34px;
      padding: 0;
      cursor: pointer;
      border-radius: 6px;
    }
    .status-msg {
      margin-top: 15px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .status-msg.ok { color: #2ed573; }
    .status-msg.err { color: #ff4757; }
  </style>
</head>
<body>

<div class="admin-container">
  <h1>Управління загальними пресетами LightNet</h1>

  <div class="auth-block">
    <input type="password" id="adminPass" placeholder="Пароль адміністратора (admin123)" style="flex:1;" />
    <button class="btn" id="saveAllBtn">Зберегти для всіх</button>
  </div>

  <div id="presetsList"></div>

  <button class="btn-add" id="addPresetBtn">+ Додати новий пресет</button>

  <div class="status-msg" id="statusMsg"></div>
</div>

<script>
  let presets = [];

  async function loadPresets() {
    try {
      const res = await fetch('/api/presets');
      presets = await res.json();
      renderList();
    } catch (e) {
      showStatus('Не вдалося завантажити пресети', false);
    }
  }

  function renderList() {
    const container = document.getElementById('presetsList');
    container.innerHTML = presets.map((p, idx) => `
      <div class="preset-card">
        <div class="preset-row">
          <div class="field-group" style="flex: 2;">
            <label>Назва пресету</label>
            <input type="text" value="${p.name || ''}" onchange="updateVal(${idx}, 'name', this.value)" />
          </div>
          <div class="field-group" style="flex: 3;">
            <label>URL (напр. /totoro.mp4 або https://...)</label>
            <input type="text" value="${p.url || ''}" onchange="updateVal(${idx}, 'url', this.value)" />
          </div>
          <div class="field-group" style="flex: 1;">
            <label>Тип</label>
            <select onchange="updateVal(${idx}, 'type', this.value)">
              <option value="video" ${p.type === 'video' ? 'selected' : ''}>video</option>
              <option value="image" ${p.type === 'image' ? 'selected' : ''}>image</option>
            </select>
          </div>
          <button class="btn-del" onclick="deletePreset(${idx})">Видалити</button>
        </div>

        <div class="preset-row">
          <div class="field-group">
            <label>Текст</label>
            <input type="color" class="color-input" value="${p.textColor || '#a4b0be'}" onchange="updateVal(${idx}, 'textColor', this.value)" />
          </div>
          <div class="field-group">
            <label>Світло є</label>
            <input type="color" class="color-input" value="${p.greenColor || '#2ed573'}" onchange="updateVal(${idx}, 'greenColor', this.value)" />
          </div>
          <div class="field-group">
            <label>Відключення</label>
            <input type="color" class="color-input" value="${p.redColor || '#ff4757'}" onchange="updateVal(${idx}, 'redColor', this.value)" />
          </div>
          <div class="field-group" style="width: 100px;">
            <label>Затемнення (%)</label>
            <input type="number" min="0" max="95" value="${p.dim || 55}" onchange="updateVal(${idx}, 'dim', Number(this.value))" />
          </div>
          <div class="field-group" style="width: 100px;">
            <label>Позиція (%)</label>
            <input type="number" min="20" max="88" value="${p.pos || 50}" onchange="updateVal(${idx}, 'pos', Number(this.value))" />
          </div>
        </div>
      </div>
    `).join('');
  }

  window.updateVal = (idx, key, val) => {
    presets[idx][key] = val;
  };

  window.deletePreset = (idx) => {
    if (confirm('Видалити цей пресет?')) {
      presets.splice(idx, 1);
      renderList();
    }
  };

  document.getElementById('addPresetBtn').onclick = () => {
    presets.push({
      name: 'Новий пресет',
      url: '/totoro.mp4',
      type: 'video',
      textColor: '#ffffff',
      greenColor: '#2ed573',
      redColor: '#ff4757',
      dim: 50,
      pos: 50
    });
    renderList();
  };

  document.getElementById('saveAllBtn').onclick = async () => {
    const password = document.getElementById('adminPass').value;
    if (!password) {
      alert('Введіть пароль адміністратора');
      return;
    }

    try {
      const res = await fetch('/api/admin/presets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password, presets })
      });
      const data = await res.json();
      if (res.ok) {
        showStatus('Пресетні теми успішно збережено для всіх користувачів!', true);
      } else {
        showStatus(data.error || 'Помилка збереження', false);
      }
    } catch (e) {
      showStatus('Помилка з’єднання із сервером', false);
    }
  };

  function showStatus(text, ok) {
    const el = document.getElementById('statusMsg');
    el.textContent = text;
    el.className = 'status-msg ' + (ok ? 'ok' : 'err');
  }

  loadPresets();
</script>
</body>
</html>
